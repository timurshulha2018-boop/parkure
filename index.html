<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PARKOUR 3D — Побег из Лавы</title>
<style>
*{margin:0;box-sizing:border-box;font-family:'Segoe UI',Arial}
#hud{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;padding:10px;pointer-events:none;z-index:5}
.pill{background:rgba(0,0,0,.65);color:#fff;padding:8px 14px;border-radius:20px;font-size:15px;font-weight:600;border:1px solid rgba(255,255,255,.2)}
#level{color:#ffd54f}#timer{color:#80d8ff}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#1a237e,#000);z-index:10;color:#fff;text-align:center}
.card{background:rgba(255,255,255,.08);padding:30px 40px;border-radius:20px;border:1px solid rgba(255,255,255,.25);max-width:520px}
h1{font-size:42px;background:linear-gradient(90deg,#ffd54f,#ff5722);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.diff{display:flex;gap:10px;justify-content:center;margin:15px 0}
.diff button{padding:12px 18px;font-size:16px;border-radius:12px;border:2px solid transparent;cursor:pointer;font-weight:700}
.diff button.sel{border-color:#fff;transform:scale(1.05)}
#easy{background:#00c853;color:#fff}#medium{background:#ff9100;color:#fff}#hard{background:#d32f2f;color:#fff}
#start{padding:14px 50px;font-size:20px;border-radius:14px;border:0;background:#fff;color:#111;font-weight:800;cursor:pointer}
#msg{position:fixed;top:35%;width:100%;text-align:center;font-size:48px;font-weight:900;text-shadow:0 4px 20px #000;display:none;z-index:6;color:#fff}
#controls{font-size:13px;opacity:.85;margin-top:10px;line-height:1.6}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head><body>
<div id="hud"><div class="pill" id="level">Уровень 1/3</div><div class="pill" id="check">Чекпоинт: старт</div>
<div class="pill" id="timer">0.0 сек</div><div class="pill" id="deaths">Падений: 0</div></div>
<div id="msg"></div>
<div id="menu"><div class="card">
<h1>🏃 PARKOUR 3D</h1><p>Побег из лавы! Допрыгни до финишного флага через 3 уровня.</p>
<div class="diff"><button id="easy" class="sel">😊 Легко</button><button id="medium">😈 Средне</button><button id="hard">🔥 Хард</button></div>
<div id="controls">WASD / стрелки — бег | ПРОБЕЛ — прыжок (двойной!) | SHIFT — спринт | Мышка (клик) — камера<br>🟩 обычные • 🟦 лёд скользкий • 🟧 батут • 🔴 лава = смерть • 🚩 флаг = финиш</div>
<br><button id="start">ИГРАТЬ ▶</button>
</div></div>
<script>
let DIFF='easy';
easy.onclick=()=>{DIFF='easy';setSel(easy)};medium.onclick=()=>{DIFF='medium';setSel(medium)};hard.onclick=()=>{DIFF='hard';setSel(hard)};
function setSel(b){document.querySelectorAll('.diff button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');}
// --- процедурные текстуры ---
function tex(fn){let c=document.createElement('canvas');c.width=c.height=128;fn(c.getContext('2d'));let t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const T={
grass:tex(g=>{g.fillStyle='#3fa34d';g.fillRect(0,0,128,128);for(let i=0;i<400;i++){g.fillStyle=`rgb(${40+Math.random()*40|0},${140+Math.random()*60|0},${50+Math.random()*40|0})`;g.fillRect(Math.random()*128,Math.random()*128,3,3);}}),
stone:tex(g=>{g.fillStyle='#8d8d9e';g.fillRect(0,0,128,128);g.strokeStyle='#5f5f6e';g.lineWidth=4;for(let y=0;y<4;y++)for(let x=0;x<4;x++)g.strokeRect(x*32+(y%2?16:0)-16,y*32,32,32);}),
ice:tex(g=>{let gr=g.createLinearGradient(0,0,128,128);gr.addColorStop(0,'#b3e5fc');gr.addColorStop(1,'#4fc3f7');g.fillStyle=gr;g.fillRect(0,0,128,128);g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=2;for(let i=0;i<5;i++){g.beginPath();g.moveTo(Math.random()*128,0);g.lineTo(Math.random()*128,128);g.stroke();}}),
lava:tex(g=>{g.fillStyle='#d32f2f';g.fillRect(0,0,128,128);g.fillStyle='#ffeb3b';for(let i=0;i<15;i++){g.beginPath();g.ellipse(Math.random()*128,Math.random()*128,12+Math.random()*14,6+Math.random()*8,Math.random()*3,0,7);g.fill();}}),
wood:tex(g=>{g.fillStyle='#8d5a2b';g.fillRect(0,0,128,128);g.fillStyle='#6d4520';for(let y=0;y<8;y++)g.fillRect(0,y*16,128,4);}),
tramp:tex(g=>{g.fillStyle='#ef6c00';g.fillRect(0,0,128,128);g.fillStyle='#ffe0b2';for(let x=0;x<8;x++)for(let y=0;y<8;y++)g.fillRect(x*16+4,y*16+4,8,8);}),
check:tex(g=>{g.fillStyle='#fff';g.fillRect(0,0,128,128);g.fillStyle='#00c853';for(let x=0;x<8;x++)for(let y=0;y<8;y++)if((x+y)%2==0)g.fillRect(x*16,y*16,16,16);}),
finish:tex(g=>{g.fillStyle='#111';g.fillRect(0,0,128,128);g.fillStyle='#fff';for(let x=0;x<8;x++)for(let y=0;y<8;y++)if((x+y)%2==0)g.fillRect(x*16,y*16,16,16);})};
let scene,cam,ren,player,plats=[],coins=[],parts=[];
let lvl=0,keys={},vy=0,jumps=0,yaw=0,pitch=0.25,t0=0,deaths=0,started=false,respawn=new THREE.Vector3(0,2,8);
let CFG={easy:{sp:0.14,jump:0.28,width:3.4},medium:{sp:0.15,jump:0.28,width:2.6},hard:{sp:0.16,jump:0.30,width:2.0}};
const LVLS=[
[{t:'grass',x:0,y:0,z:8,w:6,d:6},{t:'stone',x:0,y:0,z:2,w:3,d:3},{t:'stone',x:3,y:0.5,z:-2,w:3,d:3},{t:'ice',x:-1,y:1,z:-6,w:3,d:3},{t:'tramp',x:2,y:1,z:-10,w:3,d:3},{t:'stone',x:-2,y:3,z:-14,w:3,d:3,move:3},{t:'wood',x:2,y:3.5,z:-18,w:3,d:3},{t:'check',x:0,y:2,z:-22,w:4,d:4},{t:'stone',x:0,y:2,z:-27,w:2.6,d:2.6},{t:'ice',x:3,y:2.5,z:-31,w:2.6,d:2.6},{t:'finish',x:0,y:3,z:-36,w:5,d:5}],
[{t:'grass',x:0,y:0,z:8,w:6,d:6},{t:'wood',x:0,y:0.5,z:1,w:2.6,d:2.6},{t:'stone',x:-3,y:1,z:-3,w:2.6,d:2.6,move:4},{t:'ice',x:1,y:1.5,z:-7,w:2.6,d:2.6},{t:'tramp',x:-2,y:1.5,z:-11,w:2.6,d:2.6},{t:'stone',x:2,y:4,z:-15,w:2.4,d:2.4},{t:'wood',x:-1,y:4.5,z:-19,w:2.4,d:2.4,move:3},{t:'check',x:0,y:3,z:-23,w:4,d:4},{t:'ice',x:-3,y:3,z:-28,w:2.2,d:6,slide:1},{t:'stone',x:2,y:3.5,z:-32,w:2.2,d:2.2},{t:'finish',x:0,y:4,z:-37,w:5,d:5}],
[{t:'grass',x:0,y:0,z:8,w:6,d:6},{t:'stone',x:2,y:0.5,z:2,w:2.2,d:2.2},{t:'ice',x:-2,y:1,z:-2,w:2.2,d:2.2},{t:'stone',x:1,y:1.5,z:-6,w:2.2,d:2.2,move:5},{t:'tramp',x:-2,y:1,z:-10,w:2.2,d:2.2},{t:'wood',x:2,y:4,z:-14,w:2,d:2},{t:'stone',x:-2,y:4.5,z:-18,w:2,d:2,move:4},{t:'check',x:0,y:3,z:-22,w:3.5,d:3.5},{t:'ice',x:0,y:3,z:-27,w:2,d:8,slide:1},{t:'stone',x:3,y:4,z:-32,w:1.8,d:1.8},{t:'tramp',x:0,y:3,z:-35,w:2.2,d:2.2},{t:'finish',x:0,y:5,z:-40,w:5,d:5}]];
function build(){
scene=new THREE.Scene();scene.background=new THREE.Color(0x0b1026);scene.fog=new THREE.Fog(0x0b1026,30,110);
cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,500);
ren=new THREE.WebGLRenderer({antialias:true});ren.shadowMap.enabled=true;ren.setSize(innerWidth,innerHeight);
document.body.appendChild(ren.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.55));
let moon=new THREE.DirectionalLight(0x9db4ff,0.9);moon.position.set(20,35,15);moon.castShadow=true;scene.add(moon);
let lava=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshBasicMaterial({map:T.lava}));
lava.rotation.x=-Math.PI/2;lava.position.y=-6;T.lava.repeat.set(20,20);scene.add(lava);window._lava=lava;
let stars=new THREE.BufferGeometry(),sp=[];
for(let i=0;i<600;i++)sp.push((Math.random()-0.5)*300,20+Math.random()*120,(Math.random()-0.5)*300);
stars.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xffffff,size:0.5})));
player=new THREE.Mesh(new THREE.BoxGeometry(0.8,1.2,0.8),new THREE.MeshLambertMaterial({color:0x00e5ff}));
player.castShadow=true;scene.add(player);
let face=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.3,0.1),new THREE.MeshBasicMaterial({color:0x000000}));
face.position.set(0,0.2,-0.41);player.add(face);
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault();});
document.addEventListener('keyup',e=>keys[e.code]=false);
document.addEventListener('mousemove',e=>{if(document.pointerLockElement&&started){yaw-=e.movementX*0.0026;pitch-=e.movementY*0.0022;pitch=Math.max(-1.1,Math.min(1.1,pitch));}});
ren.domElement.addEventListener('click',()=>ren.domElement.requestPointerLock());
loadLevel(0);loop();}
function loadLevel(n){
lvl=n;[...plats,...coins].forEach(m=>scene.remove(m));plats=[];coins=[];
document.getElementById('level').textContent=`Уровень ${n+1}/3`;
let cfg=CFG[DIFF],def=LVLS[n];
respawn.set(0,2,8);player.position.copy(respawn);vy=0;
document.getElementById('check').textContent='Чекпоинт: старт';
def.forEach(d=>{
let w=(d.w||3)*(d.t==='grass'||d.t==='check'||d.t==='finish'?1:(cfg.width/3));
let dd=(d.d||3)*(d.t==='grass'||d.t==='check'||d.t==='finish'?1:(cfg.width/3));
let m=new THREE.Mesh(new THREE.BoxGeometry(w,0.6,dd),new THREE.MeshLambertMaterial({map:T[d.t]}));
m.position.set(d.x,d.y,d.z);m.receiveShadow=true;scene.add(m);
plats.push({m,type:d.t,x0:d.x,mv:d.move||0,ph:Math.random()*6,slide:d.slide||0});});
let fg=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,5),new THREE.MeshBasicMaterial({color:0xffffff}));
fg.position.set(def[def.length-1].x,def[def.length-1].y+2.5,def[def.length-1].z);scene.add(plats._flag=fg);
let fl=new THREE.Mesh(new THREE.PlaneGeometry(2.4,1.5),new THREE.MeshBasicMaterial({color:0xff1744,side:THREE.DoubleSide}));
fl.position.set(fg.position.x+1.2,fg.position.y+1.4,fg.position.z);scene.add(plats._fl=fl);
for(let i=0;i<5;i++){let c=new THREE.Mesh(new THREE.OctahedronGeometry(0.35),new THREE.MeshBasicMaterial({color:0xffd600}));
let p=def[2+Math.floor(Math.random()*(def.length-3))];c.position.set(p.x,p.y+1.5,p.z);scene.add(c);coins.push(c);}
show(`УРОВЕНЬ ${n+1}`);}
function show(t){let m=document.getElementById('msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',1500);}
function die(){deaths++;document.getElementById('deaths').textContent='Падений: '+deaths;
burst(player.position,0xff5722);player.position.copy(respawn);vy=0;jumps=0;show('💀 В ЛАВУ!');}
function burst(p,c){for(let i=0;i<12;i++){let s=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.15,0.15),new THREE.MeshBasicMaterial({color:c}));
s.position.copy(p);scene.add(s);parts.push({m:s,vx:(Math.random()-0.5)*0.3,vy:Math.random()*0.3,vz:(Math.random()-0.5)*0.3,l:30});}}
function loop(){requestAnimationFrame(loop);
let t=performance.now()/1000;if(window._lava)window._lava.position.x=Math.sin(t*0.3)*3;
plats.forEach(p=>{if(p.m&&p.mv)p.m.position.x=p.x0+Math.sin(t*1.2+p.ph)*p.mv;});
for(let i=parts.length-1;i>=0;i--){let q=parts[i];q.m.position.x+=q.vx;q.m.position.y+=q.vy;q.m.position.z+=q.vz;q.vy-=0.01;
if(--q.l<=0){scene.remove(q.m);parts.splice(i,1);}}
coins.forEach((c,i)=>{c.rotation.y+=0.06;c.position.y+=Math.sin(t*3+i)*0.005;
if(c.position.distanceTo(player.position)<1.1){scene.remove(c);coins.splice(i,1);burst(c.position,0xffd600);}});
if(start){document.getElementById('timer').textContent=((performance.now()-t0)/1000).toFixed(1)+' сек';}
if(started){
let cfg=CFG[DIFF],run=(keys['ShiftLeft']||keys['ShiftRight'])?1.7:1,sp=cfg.sp*run;
let fx=-Math.sin(yaw),fz=-Math.cos(yaw),slip=1;
plats.forEach(p=>{if(Math.abs(player.position.x-p.m.position.x)<p.m.geometry.parameters.width/2+0.4&&Math.abs(player.position.z-p.m.position.z)<p.m.geometry.parameters.depth/2+0.4&&Math.abs(player.position.y-(p.m.position.y+0.9))<0.9&&p.type==='ice')slip=1.7;});
if(keys['KeyW']||keys['ArrowUp']){player.position.x+=fx*sp*slip;player.position.z+=fz*sp*slip;}
if(keys['KeyS']||keys['ArrowDown']){player.position.x-=fx*sp;player.position.z-=fz*sp;}
if(keys['KeyA']||keys['ArrowLeft']){player.position.x+=fz*sp;player.position.z-=fx*sp;}
if(keys['KeyD']||keys['ArrowRight']){player.position.x-=fz*sp;player.position.z+=fx*sp;}
if(keys['Space']&&!loop._p&&jumps<2){vy=cfg.jump*(jumps?0.85:1);jumps++;}loop._p=keys['Space'];
vy-=0.014;player.position.y+=vy;
let on=null;plats.forEach(p=>{let hw=p.m.geometry.parameters.width/2,hd=p.m.geometry.parameters.depth/2;
if(Math.abs(player.position.x-p.m.position.x)<hw+0.3&&Math.abs(player.position.z-p.m.position.z)<hd+0.3){
let top=p.m.position.y+0.9;if(player.position.y>=top-0.35&&player.position.y<=top+0.5&&vy<=0.01)on=p;}});
if(on){if(on.type==='tramp'){vy=0.55;jumps=0;burst(player.position,0xef6c00);}
else{if(player.position.y<on.m.position.y+0.9)player.position.y=on.m.position.y+0.9;
if(on.mv)player.position.x+=Math.cos(t*1.2+on.ph)*0.05*on.mv;
if(on.type==='check'){respawn.set(on.m.position.x,on.m.position.y+1.6,on.m.position.z);
document.getElementById('check').textContent='Чекпоинт: ✔ сохранён';}
vy=0;jumps=0;
if(on.type==='finish'){if(lvl<2){show('✅ Уровень пройден!');setTimeout(()=>loadLevel(lvl+1),1200);started=false;setTimeout(()=>started=true,1300);}
else{let tm=((performance.now()-t0)/1000).toFixed(1);show(`🏆 ФИНИШ за ${tm} сек!`);started=false;}}}}
if(player.position.y<-4)die();
cam.position.set(player.position.x+Math.sin(yaw)*6*Math.cos(pitch),player.position.y+2.4+Math.sin(pitch)*6,player.position.z+Math.cos(yaw)*6*Math.cos(pitch));
cam.lookAt(player.position.x,player.position.y+0.8,player.position.z);}
ren.render(scene,cam);}
let start=false;
document.getElementById('start').onclick=()=>{document.getElementById('menu').style.display='none';
started=true;start=true;t0=performance.now();build();ren.domElement.requestPointerLock();};
</script></body></html>
